<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Pokedex</h1>
    </header>
    <main data-id="content">
      <ul id="pokemonList"></ul>
      <button
        id="loadMoreButton"
        data-id="load-more-button"
        aria-label="Load more pokemon"
      >
        Load more
      </button>
    </main>
    <!-- NEU -->
    <dialog id="pokemonDialog" data-id="dialog" aria-label="Pokemon details">
      <button
        id="closeDialogButton"
        data-id="close-dialog-button"
        aria-label="Close details"
      >
        X
      </button>
      <div id="dialogContent"></div>
    </dialog>
    <div id="loadingScreen" class="loading-screen d-none">Loading...</div>
    <script src="script.js"></script>
  </body>
</html>
